[project]
name = "bounce-viz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alli Nilles", email = "anilles137@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "colorful>=0.5.8",
    "cyaron>=0.7.0",
    "cycler>=0.12.1",
    "decorator>=5.3.1",
    "kiwisolver>=1.5.1",
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pyparsing>=3.3.3",
    "pyqt5>=5.15.11",
    "pyqt5-sip>=12.19.0",
    "python-dateutil>=2.9.0.post0",
    "six>=1.17.0",
    "swig>=4.5.0",
    "visilibity>=1.0.10",
]

[project.scripts]
bounce-viz = "bounce_viz:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
